[paths]
log_dir = "logs/cloud"

[timezone]
name = "Europe/Paris"

[mqtt]
broker = "azure.nocolor.cc"
port = 1883
username = "feiyue"
password = "123456789"

[topics]
state = "growbox/state/aggregated"
command = "growbox/commands/setpoints"

[co2]
use_fixed = true
fixed_ppm = 400.0

[watchdog]
edge_timeout_seconds = 2000

[llm]
model_name = "gpt-oss:20b"

# TOML 用 # 注释。
# 切换模型：把下面的 model_name 改成 "gpt-oss:20b" 或 "gpt-oss:120b"。
# 改完后执行：./server.sh restart
# 预热示例：
# ollama run gpt-oss:20b "hi"
# ollama run gpt-oss:120b "hi"

